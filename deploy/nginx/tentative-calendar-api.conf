# Tentative Calendar API proxy for the campusconnect.thapar.edu server block.
# Public event reads are intentionally disabled. Internal Campus Connect reads
# continue to use http://127.0.0.1:5000/api/integration/* with the API key.
location /tc-api/ {
    default_type application/json;

    set $tc_public_api_request "$request_method:$uri";
    if ($tc_public_api_request ~ ^GET:/tc-api/api/events(?:/|$)) {
        return 403 '{"success":false,"message":"Public calendar API access has been disabled"}';
    }

    rewrite ^/tc-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache_bypass $http_upgrade;
}
